<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>手機終結者 · 配音試聽</title><style>body{margin:0;background:#183c3e;color:#fff0cc;font:16px/1.6 system-ui,sans-serif}main{max-width:640px;margin:auto;padding:28px 22px}h1{font-size:28px;margin:0 0 10px}h2{font-size:20px;margin:28px 0 12px}p{color:#d4c6a8}a{color:#ffd76b}button,select{font:inherit;min-height:48px;border:1px solid #718d89;border-radius:10px;padding:10px 14px;background:#285052;color:#fff0cc;cursor:pointer}button:focus-visible,select:focus-visible{outline:3px solid #ffd76b;outline-offset:3px}button:hover{background:#38676a}.actions{display:flex;gap:10px;flex-wrap:wrap}.voices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.voices button{text-align:left;font-size:14px}.voices small{display:block;color:#d4c6a8}#play{background:#ffd76b;color:#30261e;font-weight:700}#caption{min-height:30px;color:#ffd76b;font-size:20px}output{font-size:13px;color:#d4c6a8}@media(max-width:380px){.voices{grid-template-columns:1fr}}</style></head><body><main><h1>手機終結者 · 聲音試聽</h1><p>粗獷台語老闆 × 電子節奏。按台詞可單獨試聽，也可以先播放音樂，聽配音時自動降低背景音量。</p><h2>電子音樂</h2><div class="actions"><label>強度 <select id="level"><option value="1">熱身 · 124 BPM</option><option value="2">連甩 · 134 BPM</option><option value="3">假動作 · 144 BPM</option><option value="4">暴走 · 154 BPM</option><option value="5">最後暴走 · 164 BPM</option></select></label><button id="play">播放音樂</button><button id="stop">全部停止</button></div><h2>老闆喊話</h2><div id="voices" class="voices"></div><p id="caption" role="status" aria-live="polite"></p><output id="status">點按即可載入配音。</output><p><a href="./">回到遊戲</a></p></main><script type="module">
import {AudioFX,VOICE_LINES} from './audio.js';
const $=id=>document.getElementById(id),audio=new AudioFX({onVoice:text=>$('caption').textContent=text});
const labels={intro:'開場',again:'左右連甩',trick:'假動作',wild:'狂牛暴走',final:'最後六秒',lose_air:'摔落 · 飛走了',lose_rest:'摔落 · 先休息',win:'成功通關'};
async function init(){audio.init();await Promise.all(audio.pending.values());$('status').textContent=`配音 ${audio.buffers.size} / 8 已載入。`;} 
for(const [id,text] of Object.entries(VOICE_LINES)){const b=document.createElement('button'),small=document.createElement('small');b.textContent=text;small.textContent=labels[id];b.append(small);b.onclick=()=>{init();audio.speak(id,3);};$('voices').append(b);}
$('play').onclick=()=>{init();audio.setScene('playing');audio.update({level:Number($('level').value),recovery:false});$('play').textContent='音樂播放中';};
$('level').onchange=()=>audio.update({level:Number($('level').value),recovery:false});
$('stop').onclick=()=>{audio.pause();$('play').textContent='播放音樂';};
document.addEventListener('visibilitychange',()=>{if(document.hidden){audio.pause();$('play').textContent='播放音樂';}});window.addEventListener('pagehide',()=>audio.destroy());
</script></body></html>
