<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#234b4e"><meta name="description" content="傾斜手機，穩住牛仔。抵抗越來越激烈的甩動，挑戰你的騎牛存活紀錄。"><title>手機終結者 · Tilt Rodeo</title><link rel="icon" href="icon.svg"><link rel="stylesheet" href="styles.css"></head>
<body><main id="game" data-state="ready">
 <header><h1><span class="brand-title">TILT<br>RODEO</span><span class="brand-subtitle">手機終結者</span></h1><nav aria-label="遊戲設定"><button id="sound" class="icon-button" aria-label="靜音音效" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4zM17 8c3 2 3 6 0 8M20 5c5 4 5 10 0 14"/></svg></button><button id="pause" class="icon-button" aria-label="暫停遊戲" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14M16 5v14"/></svg></button></nav></header>
 <section id="arena" aria-label="牛仔騎牛競技場"><canvas id="scene" aria-label="牛仔隨著你的操控左右傾斜。下方平衡條提供目前重心。"></canvas>
  <div class="scoreboard"><div><span id="time-label">存活時間</span><strong><span id="time">0.0</span><small>秒</small></strong></div><p>最佳 <span id="best">0.0</span> 秒<span id="level">熱身牛仔</span></p></div>
  <div id="cue" hidden aria-live="polite"></div><div id="countdown" hidden aria-live="assertive">3</div>
  <p id="asset-status" role="status">牛仔正在上場…</p><div id="scene-error" hidden role="alert">這個瀏覽器無法顯示 3D 場景。請使用較新的 Safari 或 Chrome，並開啟硬體加速。</div>
 </section>
 <section id="controls" aria-label="平衡操控"><div class="balance-caption"><span id="balance-label">把重心留在中央</span><span id="grip-label">抓穩 100%</span></div>
  <div id="balance" role="meter" aria-label="牛仔左右重心" aria-valuemin="-100" aria-valuemax="100" aria-valuenow="0"><span class="safe-zone"></span><span class="center-mark"></span><span class="balance-ticks" aria-hidden="true"></span><span id="balance-pin"></span></div>
  <div class="control-body"><div id="message" aria-live="polite"><h2 id="heading">手機終結者，撐過 30 秒。</h2><p id="hint">雙手握穩，輕斜就能救回牛仔。<br>看預告反打，連甩之間有喘息。</p></div>
  <p id="error" role="alert" hidden></p>
  <div id="touch-controls" hidden><button id="left" aria-label="向左平衡"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 5-7 7 7 7"/></svg>向左</button><span>按住扶正<br><small>電腦用 ← →</small></span><button id="right" aria-label="向右平衡">向右<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m10 5 7 7-7 7"/></svg></button></div>
  <button id="primary">啟用手機傾斜</button><button id="secondary">先用觸控／方向鍵試玩</button><p id="mode-note">不用下載 · 感測資料只留在手機</p></div>
 </section>
 <section id="pause-cover" hidden role="dialog" aria-modal="true" aria-labelledby="pause-title"><div><h2 id="pause-title">先抓好韁繩。</h2><p id="pause-hint">遊戲已暫停，時間不會繼續跑。</p><button id="resume">繼續挑戰</button><button id="restart" class="quiet">回到起點</button></div></section>
</main><script type="module" src="app.js"></script></body></html>
